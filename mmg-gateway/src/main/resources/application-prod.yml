spring:
  application:
    name: mmg-gateway
  config:
    import: "optional:file:.env.prod[.properties]"

  cloud:
    gateway:
      server:
        webmvc:
          cors:
            configurations:
              '[/**]':
                allowed-origins:
                  - "${CORS_ALLOWED_ORIGINS}"
                allowed-methods: ["*"]
                allowed-headers: ["*"]
                allow-credentials: true
                max-age: 3600
          routes:
            # ---------- /api/user/review/** → main (prefix 충돌 회피, 위에 위치) ----------
            - id: review-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/user/review/**
            - id: user-coupon-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/user/coupon,/api/user/coupon/**

            # ---------- auth-service (8081) ----------
            - id: auth-user-route        # /api/user/login | join | check-id | me | reissue | logout 등
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/user,/api/user/**
            - id: auth-policy-route      # /api/policy/**
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/policy,/api/policy/**

            # ---------- main-service (8080) ----------
            - id: main-store-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/store,/api/store/**
            - id: main-cart-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/cart,/api/cart/**
            - id: main-order-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/order,/api/order/**
            - id: main-payment-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/payment,/api/payment/**
            - id: main-notification-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/notification,/api/notification/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
            - id: main-address-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/address,/api/address/**
            - id: main-owner-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/owner,/api/owner/**
            - id: main-chatbot-route          # 2026-05-25 9건 트랙 #5/#6 — 사장/라이더 챗봇 호출 라우트
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/chatbot,/api/chatbot/**
            - id: main-attendance-route       # 2026-05-25 9건 트랙 #8 부채 Step B — 출석 시스템
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/attendance,/api/attendance/**
            - id: main-pet-route              # 2026-05-25 9건 트랙 #8 — 펫 도메인
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/pet,/api/pet/**
            - id: main-map-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/map,/api/map/**
            - id: main-delivery-photo-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/delivery-photo,/api/delivery-photo/**
            - id: main-rider-license-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/rider-license,/api/rider-license/**
            - id: main-mypage-route
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/mypage,/api/mypage/**
            - id: main-uploads-route     # 이미지 정적 (CLAUDE.md §5 main 단독 책임)
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/uploads/**

            # ---------- rider-service (8082) — Phase 5 본격 진행 시 ----------
            - id: rider-route
              uri: ${RIDER_SERVICE_URL}
              predicates:
                - Path=/api/rider,/api/rider/**

            # ---------- admin-service (8083) — Phase 5 본격 진행 시 ----------
            - id: admin-route
              uri: ${ADMIN_SERVICE_URL}
              predicates:
                - Path=/api/admin,/api/admin/**

            # /internal/** 라우팅 의도적 부재: InternalBlockController가 403 응답 (외부 노출 0)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
